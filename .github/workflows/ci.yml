name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check, lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end with Letta Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm install -g @letta-ai/letta-code
      - run: npx vitest run test/e2e.test.ts
        env:
          LACP_E2E_LETTA: letta
